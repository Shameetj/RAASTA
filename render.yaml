services:
  # Authoritative Dev1 Backend Service (FastAPI)
  - type: web
    name: raasta-dev1
    runtime: python
    rootDir: backend/developer1
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn test_app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEV2_ROUTING_URL
        value: "https://raasta-dev2.onrender.com/route"

  # Dev2 Routing Engine Service (FastAPI)
  - type: web
    name: raasta-dev2
    runtime: python
    rootDir: backend/developer2
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn routing_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8001
      - key: PYTHON_VERSION
        value: 3.11.0
